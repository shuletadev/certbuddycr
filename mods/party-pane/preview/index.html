<!doctype html><meta charset="utf-8"><title>party preview</title>
<style>body{margin:0;font:13px system-ui;display:grid;grid-template-columns:1fr 1fr}
.p{padding:16px}.l{background:#fff;color:#222}.d{background:#1f1f1f;color:#ddd}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.c{width:120px;text-align:center}.c svg{width:110px;height:116px}</style>
<div class="p l" id="l"></div><div class="p d" id="d"></div>
<script type="module">
import {portrait,NAMES} from '../hooks/art.js'
for (const id of ['l','d']) { const root=document.getElementById(id)
 for (const state of ['working','idle','done','failed']) {
  const row=document.createElement('div');row.className='row';
  row.innerHTML=Object.keys(NAMES).map(k=>`<div class="c">${portrait(k,state)}<div>${NAMES[k]} · ${state}</div></div>`).join('')
  root.appendChild(row) } }
</script>
